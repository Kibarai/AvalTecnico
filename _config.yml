# ---------------------------------------------------------------------------
# Configuración de Jekyll — avaltecnico.com
# Los textos editables desde Pages CMS están en _data/ y en el front matter
# de cada página. Este fichero es técnico: normalmente no hace falta tocarlo.
# ---------------------------------------------------------------------------

title: "Aval Técnico"
tagline: "Carlos Jiménez"
description: >-
  Te ayudo a priorizar qué construir y a comprobar que tu equipo o proveedor de
  desarrollo lo está construyendo bien.
url: "https://avaltecnico.com"
baseurl: ""
lang: es
timezone: Europe/Madrid

author:
  name: "Carlos Jiménez"
  email: "carlos.jimenez@avaltecnico.com"

# La imagen para compartir en redes (1200x630) se asigna a todas las páginas
# desde "defaults" (abajo): /assets/img/og-default.png
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values: { layout: "page", image: "/assets/img/og-default.png" }
  - scope: { path: "index.md" }
    values: { layout: "home", permalink: "/" }
  - scope: { path: "servicios.md" }
    values: { permalink: "/servicios/" }
  - scope: { path: "sobre-mi.md" }
    values: { permalink: "/sobre-mi/" }
  - scope: { path: "independencia.md" }
    values: { permalink: "/independencia/" }
  - scope: { path: "contacto.md" }
    values: { layout: "contacto", permalink: "/contacto/" }
  - scope: { path: "legal/aviso-legal.md" }
    values: { permalink: "/aviso-legal/", sitemap: false }
  - scope: { path: "legal/privacidad.md" }
    values: { permalink: "/privacidad/", sitemap: false }

sass:
  style: compressed

exclude:
  - marca   # material de marca, fuera del repositorio (ver .gitignore)
  - Gemfile
  - Gemfile.lock
  - README.md
  - posicionamiento-estrategia.md
  - vendor
  - .github
  - node_modules
  - "*.gem"
  - Rakefile
