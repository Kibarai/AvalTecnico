  <text x="600" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="58" fill="#e6edf3">Ningún desarrollo acaba costando</text>
  <text x="600" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="58" fill="#8b7dff">lo que parecía que iba a costar.</text>
  <text x="600" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#c2ccd6">Y la causa casi nunca es una estimación errónea.</text>
